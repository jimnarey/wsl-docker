name: Build Ubuntu 24.04 (noble) rootfs

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap gzip python3-venv python3-pip qemu-utils parted kpartx e2fsprogs util-linux

      - name: Build Ubuntu 24.04 (noble) rootfs
        run: |
          set -euo pipefail
          ROOTFS_DIR=$(mktemp -d)
          echo "Building into $ROOTFS_DIR"
          sudo debootstrap --variant=minbase --arch=amd64 noble "$ROOTFS_DIR" http://archive.ubuntu.com/ubuntu/

          # Copy the chroot provisioner into the rootfs
          sudo mkdir -p "$ROOTFS_DIR"/tmp
          sudo cp provision/chroot-provision.sh "$ROOTFS_DIR"/tmp/chroot-provision.sh
          sudo chmod +x "$ROOTFS_DIR"/tmp/chroot-provision.sh

          # Bind mount kernel filesystems for chroot
          sudo mount --bind /proc "$ROOTFS_DIR"/proc
          sudo mount --bind /sys "$ROOTFS_DIR"/sys
          sudo mount --bind /dev "$ROOTFS_DIR"/dev

          # Run provisioner inside chroot
          sudo chroot "$ROOTFS_DIR" /bin/bash /tmp/chroot-provision.sh

          # Unmount binds
          sudo umount "$ROOTFS_DIR"/proc || true
          sudo umount "$ROOTFS_DIR"/sys || true
          sudo umount "$ROOTFS_DIR"/dev || true

          # Prepare rootfs for systemd in WSL
          echo "Configuring rootfs for systemd support (WSL)..."
          # Enable systemd when the distro is launched under WSL
          echo -e "[boot]\nsystemd=true" | sudo tee "$ROOTFS_DIR/etc/wsl.conf" > /dev/null
          # Generate a machine-id for systemd services
          sudo mkdir -p "$ROOTFS_DIR/etc"
          sudo sh -c 'cat /proc/sys/kernel/random/uuid > "$ROOTFS_DIR/etc/machine-id"'
          # Prepare persistent journal directory (optional but helpful)
          sudo mkdir -p "$ROOTFS_DIR/var/log/journal"
          sudo chmod 0755 "$ROOTFS_DIR/var/log/journal"

          # Create a preformatted VHDX for /home and inject PARTUUID into rootfs fstab
          echo "Creating preformatted VHDX for /home"
          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"
          # Create sparse raw image (adjust size as desired)
          fallocate -l 64M home.raw
          # Create GPT and single partition
          sudo parted -s home.raw mklabel gpt
          sudo parted -s home.raw mkpart primary 1MiB 100%
          # Map loop device and partition
          LOOP=$(sudo losetup --partscan --find --show home.raw)
          PART="${LOOP}p1"
          # Format partition as ext4
          sudo mkfs.ext4 -F "$PART"
          # Read PARTUUID for fstab
          PARTUUID=$(sudo blkid -s PARTUUID -o value "$PART")
          echo "Created partition with PARTUUID=$PARTUUID"
          # Ensure /etc/fstab exists and append fstab entry for /home using PARTUUID
          sudo mkdir -p "$ROOTFS_DIR/home"
          echo "PARTUUID=$PARTUUID /home ext4 defaults 0 2" | sudo tee -a "$ROOTFS_DIR/etc/fstab"
          # Detach loop and convert to VHDX
          sudo losetup -d "$LOOP"
          qemu-img convert -f raw -O vhdx home.raw home.vhdx
          mv home.vhdx "$GITHUB_WORKSPACE"/
          cd -
          rm -rf "$WORKDIR"

          # Create tarball
          sudo tar -C "$ROOTFS_DIR" -c . | gzip -9 > ubuntu-noble-amd64.tar.gz
          ls -lh ubuntu-noble-amd64.tar.gz
          ls -lh home.vhdx || true

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Upload release asset using Python tool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/release_uploader.py
